<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmira Bay — Open-World Crime Game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #141a2a; }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #fallback { position: fixed; inset: 0; display: none; place-items: center;
    color: #fff; font: 16px system-ui, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<div id="fallback"><p>Palmira Bay needs JavaScript and a modern desktop browser.<br>Open this page over http:// (for example <code>node serve.ts</code>) and play.</p></div>
<script type="module">
  import { createGame, startGame } from './src/main.js';
  const canvas = document.getElementById('game');
  try {
    const game = createGame(canvas);
    window.__palmiraBay = game;
    startGame(game);
  } catch (err) {
    document.getElementById('fallback').style.display = 'grid';
    console.error(err);
  }
</script>
<noscript><p style="color:#fff;font:16px system-ui">Palmira Bay needs JavaScript enabled.</p></noscript>
</body>
</html>
